name: Build Windows audio module

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'addon/**'
      - 'app.js'
      - 'main.js'
      - 'preload.js'
      - 'screen-audio-worklet.js'
      - 'rebuild-addon.js'
      - 'tests/windows-audio-addon-guard.js'
      - 'tests/windows-audio-renderer-smoke.js'
      - 'scripts/windows-audio-addon-guard.js'
      - 'scripts/before-pack.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows-audio.yml'
  push:
    branches: [main, master]
    paths:
      - 'addon/**'
      - 'app.js'
      - 'main.js'
      - 'preload.js'
      - 'screen-audio-worklet.js'
      - 'rebuild-addon.js'
      - 'tests/windows-audio-addon-guard.js'
      - 'tests/windows-audio-renderer-smoke.js'
      - 'scripts/windows-audio-addon-guard.js'
      - 'scripts/before-pack.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows-audio.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - run: npm run rebuild:addon
      - run: npm run verify:addon
      - run: npm run test:windows-audio
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pair-capture-windows-x64
          path: |
            addon/build/Release/pair-capture.node
            addon/build/Release/pair-capture.manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: knot-windows-installer
          path: dist/Knot Setup *.exe
          if-no-files-found: error
