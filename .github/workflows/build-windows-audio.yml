name: Build Windows audio module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - run: npx --yes node-gyp rebuild --directory addon --target=43.2.0 --arch=x64 --dist-url=https://electronjs.org/headers
      - uses: actions/upload-artifact@v4
        with:
          name: pair-capture-windows-x64
          path: addon/build/Release/pair-capture.node
          if-no-files-found: error
