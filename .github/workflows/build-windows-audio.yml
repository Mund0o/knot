name: Build Windows audio module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run rebuild:addon
      - uses: actions/upload-artifact@v4
        with:
          name: pair-capture-windows-x64
          path: addon/build/Release/pair-capture.node
          if-no-files-found: error
