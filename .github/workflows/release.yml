name: Release Knot

# Builds Windows and Linux, signs the update feed with the offline Ed25519 key
# stored in the KNOT_UPDATE_SIGNING_KEY repository secret, creates the GitHub
# release, and only then publishes public/latest.json so the in-app updater
# never sees a feed whose downloads do not exist yet.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Short notes shown in the in-app update prompt
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Release only from the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run this workflow on ${{ github.event.repository.default_branch }}; the updater reads latest.json from there."
          exit 1
      - uses: actions/checkout@v4
      - id: bump
        run: node -e "const v=require('./package.json').version.split('.');v[2]=String(Number(v[2])+1);console.log('version='+v.join('.'))" >> "$GITHUB_OUTPUT"
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version
      - run: npm run rebuild:addon
      - run: npm run verify:addon
      - run: npm run test:windows-audio
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Knot Setup *.exe
            dist/Knot Setup *.exe.blockmap
            addon/build/Release/pair-capture.node
            addon/build/Release/pair-capture.manifest.json
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/pair-p2p-*.tar.gz
            dist/Knot-*.AppImage
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ inputs.notes }}
      # Without the key the release is still created, but latest.json is not
      # updated, so installed copies will not offer it automatically.
      HAS_KEY: ${{ secrets.KNOT_UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each artifact is stored relative to its files' common folder.
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - run: npm version "$VERSION" --no-git-tag-version
      - name: Sign the update feed
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.KNOT_UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/knot-update.pem"
          KNOT_UPDATE_SIGNING_KEY="$RUNNER_TEMP/knot-update.pem" PAIR_NOTES="$NOTES" node publish-update.js
          rm -f "$RUNNER_TEMP/knot-update.pem"
      - name: Create the GitHub release
        run: |
          notes="docs/releases/v$VERSION.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --notes "$NOTES"; fi
          gh release create "v$VERSION" \
            "dist/Knot Setup $VERSION.exe" \
            "dist/pair-p2p-$VERSION.tar.gz" \
            "dist/Knot-$VERSION.AppImage" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Knot $VERSION" "$@"
      - name: Check every feed download matches its signed hash
        if: env.HAS_KEY == 'true'
        run: |
          node -e '
            const m=require("./public/latest.json");
            for (const [u,h] of [[m.winUrl,m.winSha256],[m.linuxUrl,m.linuxSha256],[m.linuxAppImageUrl,m.linuxAppImageSha256]]) console.log(u+" "+h);
          ' | while read -r url hash; do
            for attempt in 1 2 3 4 5; do
              actual=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) && [ "$actual" = "$hash" ] && break
              sleep 10
            done
            if [ "$actual" != "$hash" ]; then echo "::error::$url does not match the signed feed"; exit 1; fi
            echo "ok $url"
          done
      - name: Record the release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            addon/build/Release/pair-capture.node addon/build/Release/pair-capture.manifest.json
          if [ "$HAS_KEY" = true ]; then git add public/latest.json; fi
          git commit -m "Release Knot $VERSION" -m "$NOTES"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
